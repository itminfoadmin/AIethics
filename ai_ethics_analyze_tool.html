// ── Code 관리 ──
let schemeManagerData = [];

async function openSchemeManager() {
  document.getElementById('schemeManagerOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
  const body = document.getElementById('schemeManagerBody');
  body.innerHTML = '<div class="summary-loading"><div class="dynamic-spinner"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="dot"></div></div><div class="loading-text">Code 로드 중...</div></div>';
  try {
    await loadCodeTab();
    schemeManagerData = codeTabData.map(d => ({ ...d, descs: [...d.descs] }));
    renderSchemeManager();
  } catch(e) {
    body.innerHTML = '<div style="text-align:center;padding:40px;color:#999;">Code 로드 실패</div>';
  }
}
function closeSchemeManager() {
  document.getElementById('schemeManagerOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

function renderSchemeManager() {
  const body = document.getElementById('schemeManagerBody');
  let html = '<table class="scheme-mgr-table"><thead><tr><th style="width:40px">순서</th><th style="width:120px">Code</th><th>Dilemma-1 설명</th><th>Dilemma-2 설명</th><th>Dilemma-3 설명</th><th>Dilemma-4 설명</th><th style="width:50px">관리</th></tr></thead><tbody>';
  schemeManagerData.forEach((d, i) => {
    html += '<tr><td><div class="scheme-mgr-actions">' +
      '<button class="btn btn-gray" onclick="smMoveRow(' + i + ',-1)">▲</button>' +
      '<button class="btn btn-gray" onclick="smMoveRow(' + i + ',1)">▼</button>' +
      '</div></td>' +
      '<td><input type="text" value="' + escAttr(d.code) + '" onchange="smUpdateField(' + i + ',\'code\',this.value)" /></td>' +
      '<td><textarea rows="1" class="sm-auto-ta" onchange="smUpdateField(' + i + ',0,this.value)" oninput="smAutoGrow(this)">' + escHtml(d.descs[0]) + '</textarea></td>' +
      '<td><textarea rows="1" class="sm-auto-ta" onchange="smUpdateField(' + i + ',1,this.value)" oninput="smAutoGrow(this)">' + escHtml(d.descs[1]) + '</textarea></td>' +
      '<td><textarea rows="1" class="sm-auto-ta" onchange="smUpdateField(' + i + ',2,this.value)" oninput="smAutoGrow(this)">' + escHtml(d.descs[2]) + '</textarea></td>' +
      '<td><textarea rows="1" class="sm-auto-ta" onchange="smUpdateField(' + i + ',3,this.value)" oninput="smAutoGrow(this)">' + escHtml(d.descs[3]) + '</textarea></td>' +
      '<td><div class="scheme-mgr-actions"><button class="btn btn-red" onclick="smDeleteRow(' + i + ')" title="삭제">✕</button></div></td></tr>';
  });
  html += '</tbody></table>';
  html += '<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;"><button class="btn btn-green" onclick="addSchemeRow()">＋ 행 추가</button><button class="btn btn-blue" onclick="smSaveAll()">💾 저장</button></div>';
  body.innerHTML = html;
  body.querySelectorAll('.sm-auto-ta').forEach(ta => smAutoGrow(ta));
}

function smAutoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function smUpdateField(idx, field, value) { if (field === 'code') schemeManagerData[idx].code = value; else schemeManagerData[idx].descs[field] = value; }
function addSchemeRow() { schemeManagerData.push({ code: '', descs: ['','','',''], rowIndex: -1 }); renderSchemeManager(); document.getElementById('schemeManagerBody').scrollTop = 99999; }
function smMoveRow(idx, dir) { const ni = idx + dir; if (ni < 0 || ni >= schemeManagerData.length) return; const t = schemeManagerData[idx]; schemeManagerData[idx] = schemeManagerData[ni]; schemeManagerData[ni] = t; renderSchemeManager(); }
function smDeleteRow(idx) { if (!confirm('이 Code를 삭제하시겠습니까?\n(' + (schemeManagerData[idx].code || '빈 값') + ')')) return; schemeManagerData.splice(idx, 1); renderSchemeManager(); }

async function smSaveAll() {
  const payload = { action: 'saveCodes', codes: schemeManagerData.map(d => ({ code: d.code, d1: d.descs[0], d2: d.descs[1], d3: d.descs[2], d4: d.descs[3] })) };
  const body = document.getElementById('schemeManagerBody');
  body.innerHTML = '<div class="summary-loading"><div class="dynamic-spinner"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="dot"></div></div><div class="loading-text">저장 중...</div></div>';
  try {
    const resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(payload), redirect:'follow' });
    const json = await resp.json();
    if (json.status !== 'ok') throw new Error(json.message);
    showToast('Code 저장 완료');
    await loadCodeTab();
    schemeManagerData = codeTabData.map(d => ({ ...d, descs: [...d.descs] }));
    renderSchemeManager();
    renderCards();
  } catch(err) {
    console.error('Code 저장 실패:', err);
    showToast('Code 저장 실패: ' + err.message, true);
    renderSchemeManager();
  }
}

// ── 결과 인쇄 ──
function printCards() {
  const DILEMMA_SHORT_NAMES = { '1': '프라이버시 보호', '2': '데이터 관리', '3': '공공성', '4': '침해금지' };
  const dil = document.getElementById('selDilemma').value;
  const dm = DILEMMA_MAP[dil];
  const data = applySortToData(getFilteredData(), currentSortKey);

  const liveEdits = {};
  document.querySelectorAll('.editable-field').forEach(inp => { liveEdits[inp.dataset.rownum + '_' + inp.dataset.field] = inp.tagName === 'SELECT' ? inp.value : inp.value; });

  const title = 'Assessment Result Report [Dilemma-0' + dil + '_' + (DILEMMA_SHORT_NAMES[dil]||'') + ']';
  let html = '<div class="print-report-overlay"><div class="print-report-title">' + escHtml(title) + '</div>';
  html += '<table class="print-report-table"><colgroup><col style="width:7%"><col style="width:5%"><col style="width:5%"><col style="width:17%"><col style="width:33%"><col style="width:11%"><col style="width:22%"></colgroup>';
  html += '<thead><tr><th>ResID</th><th>N2</th><th>P%</th><th>Response-1</th><th>Response-2</th><th>Result</th><th>Result_Reason</th></tr></thead><tbody>';

  data.forEach(row => {
    const r1 = getCellVal(row, dm.r1);
    const r2 = getCellVal(row, dm.r2);
    const rr = liveEdits[row.rowNum + '_resultReason'] ?? getCellVal(row, dm.resultReason);
    const res = liveEdits[row.rowNum + '_result'] ?? getCellVal(row, dm.result);
    html += '<tr><td class="center">' + escHtml(row.A) + '</td><td class="center">' + fmtScore(row.B) + '</td><td class="center">' + fmtScore(row.C) + '</td><td>' + escHtml(r1) + '</td><td>' + escHtml(r2) + '</td><td class="center">' + escHtml(res) + '</td><td>' + escHtml(rr) + '</td></tr>';
  });

  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const dateStr = now.getFullYear() + '. ' + pad(now.getMonth()+1) + '. ' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  html += '</tbody><tfoot><tr><td colspan="7" style="border:none;padding:6px 0 0;font-size:9px;color:#555;"><span style="float:right;">' + escHtml(dateStr) + '</span></td></tr></tfoot></table></div>';

  let overlay = document.getElementById('printReportOverlay');
  if (overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id = 'printReportOverlay';
  overlay.style.display = 'none';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  const style = document.createElement('style');
  style.id = 'cards-print-style';
  style.textContent = '@media print { @page { size:A3 landscape; margin:8mm; } }';
  document.head.appendChild(style);

  overlay.style.display = 'block';
  document.body.classList.add('printing-cards');
  window.print();
  document.body.classList.remove('printing-cards');
  overlay.remove();
  style.remove();
}

// ── Dataset 인쇄 ──

  const dateStr = now.getFullYear() + '. ' + pad(now.getMonth()+1) + '. ' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  html += '</tbody><tfoot><tr><td colspan="9" style="border:none;padding:6px 0 0;font-size:9px;color:#555;"><span style="float:right;">' + escHtml(dateStr) + '</span></td></tr></tfoot></table></div>';

  let overlay = document.getElementById('printReportOverlay');

  overlay.style.display = 'none';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);

  const style = document.createElement('style');
  style.id = 'cards-print-style';
  style.textContent = '@media print { @page { size:A3 landscape; margin:8mm; } }';
  document.head.appendChild(style);

  overlay.style.display = 'block';
  document.body.classList.add('printing-cards');
  window.print();
  document.body.classList.remove('printing-cards');
  overlay.remove();

// ── 종료 모달 ──
let exitTimer = null;

function showExitConfirm() {
  const unsaved = getUnsavedChanges();
  document.getElementById('exitModalIcon').textContent = '🚪';
  document.getElementById('exitModalTitle').textContent = '종료 확인';
  if (unsaved.length > 0) {
    document.getElementById('exitModalMsg').textContent = '저장되지 않은 변경사항이 ' + unsaved.length + '건 있습니다.\n저장하고 종료하시겠습니까?';
    document.getElementById('exitModalBtns').style.display = 'none';
    document.getElementById('exitModalBtnsUnsaved').style.display = 'flex';
  } else {
    document.getElementById('exitModalMsg').textContent = '정말 종료하시겠습니까?';
    document.getElementById('exitModalBtns').style.display = 'flex';
    document.getElementById('exitModalBtnsUnsaved').style.display = 'none';
  }
  document.getElementById('exitModalOverlay').classList.add('show');
}

function cancelExit() {
  if (exitTimer) { clearInterval(exitTimer); exitTimer = null; }
  document.getElementById('exitModalOverlay').classList.remove('show');
}

async function saveAndExit() {
  document.getElementById('exitModalBtnsUnsaved').style.display = 'none';
  document.getElementById('exitModalIcon').textContent = '💾';
  document.getElementById('exitModalTitle').textContent = '저장 중...';
  document.getElementById('exitModalMsg').innerHTML = '<div class="dynamic-spinner" style="margin:0 auto;"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="dot"></div></div><div style="margin-top:16px;color:#64748b;">변경사항을 저장하고 있습니다...</div>';
  try {
    const inputs = document.querySelectorAll('.editable-field');
    const updates = [];
    inputs.forEach(inp => {
      const rowNum = parseInt(inp.dataset.rownum);
      const dil = inp.dataset.dilemma;
      const field = inp.dataset.field;
      const dm = DILEMMA_MAP[dil];
      const colIdx = dm[field];
      const colKey = field + 'Col';
      const matchRow = allData.find(r => r.rowNum === rowNum);
      const original = (matchRow && matchRow.raw && colIdx < matchRow.raw.length) ? matchRow.raw[colIdx] : '';
      const curVal = inp.tagName === 'SELECT' ? inp.value : inp.value;
      if (curVal.trim() !== original.trim()) updates.push({ row: rowNum, col: dm[colKey], value: curVal });
    });
    if (updates.length > 0) {
      const resp = await fetch(GAS_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'save',updates}), redirect:'follow' });
      const json = await resp.json();
      if (json.status !== 'ok') throw new Error(json.message);
    }
    document.getElementById('exitModalIcon').textContent = '✅';
    document.getElementById('exitModalTitle').textContent = '저장 완료';
    document.getElementById('exitModalMsg').textContent = (updates.length > 0 ? updates.length + '건 저장 완료! ' : '') + '종료합니다...';
    setTimeout(() => confirmExit(), 800);
  } catch(err) {
    document.getElementById('exitModalIcon').textContent = '⚠️';
    document.getElementById('exitModalTitle').textContent = '저장 실패';
    document.getElementById('exitModalMsg').textContent = '저장에 실패했습니다: ' + err.message + '\n그래도 종료하시겠습니까?';
    document.getElementById('exitModalBtnsUnsaved').innerHTML = '<button class="btn btn-red" onclick="confirmExit()">그냥 종료</button><button class="btn btn-gray" onclick="cancelExit()">취소</button>';
    document.getElementById('exitModalBtnsUnsaved').style.display = 'flex';
  }
}

function confirmExit() {
  document.getElementById('exitModalBtns').style.display = 'none';
  document.getElementById('exitModalBtnsUnsaved').style.display = 'none';
  document.getElementById('exitModalIcon').textContent = '👋';
  document.getElementById('exitModalTitle').textContent = '종료 중';
  let count = 3;
  document.getElementById('exitModalMsg').innerHTML = '<div class="exit-countdown">' + count + '</div>초 후에 종료됩니다.';
  exitTimer = setInterval(() => {
    count--;
    if (count > 0) {
      document.getElementById('exitModalMsg').innerHTML = '<div class="exit-countdown">' + count + '</div>초 후에 종료됩니다.';
    } else {
      clearInterval(exitTimer); exitTimer = null;
      try { window.close(); } catch(e) {}
      setTimeout(() => { document.title = '종료됨'; document.body.innerHTML = ''; document.body.style.background = '#f1f5f9'; }, 200);
    }
  }, 1000);
}

// ── 고정 헤더 높이 동기화 ──

  const h = document.getElementById('fixedHeader');
  const s = document.querySelector('.header-spacer');

}
window.addEventListener('resize', syncHeaderSpacer);
